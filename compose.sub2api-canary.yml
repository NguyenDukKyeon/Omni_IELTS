services:
  sub2api:
    image: weishaw/sub2api:0.1.179@sha256:bc449ed7c29acabc4f36fdc2fb5acd9d6a6326cc54465137ce34150bd4b860b8
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: release
      RUN_MODE: simple
      DATABASE_HOST: sub2api-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?SUB2API_POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: sub2api-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SUB2API_REDIS_PASSWORD:?SUB2API_REDIS_PASSWORD is required}
      JWT_SECRET: ${SUB2API_JWT_SECRET:?SUB2API_JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${SUB2API_TOTP_ENCRYPTION_KEY:?SUB2API_TOTP_ENCRYPTION_KEY is required}
      OPS_ENABLED: "false"
      SECURITY_URL_ALLOWLIST_ENABLED: "true"
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "false"
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "false"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${SUB2API_DASHBOARD_PORT:-8082}:8080"
    volumes:
      - sub2api_data:/app/data
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      sub2api-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 7s
      retries: 6
      start_period: 30s

  sub2api-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${SUB2API_POSTGRES_PASSWORD:?SUB2API_POSTGRES_PASSWORD is required}
      POSTGRES_DB: sub2api
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - sub2api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  sub2api-redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SUB2API_REDIS_PASSWORD:?SUB2API_REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${SUB2API_REDIS_PASSWORD:?SUB2API_REDIS_PASSWORD is required}
      TZ: Asia/Ho_Chi_Minh
    command: ["sh", "-c", "exec redis-server --save 60 1 --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - sub2api_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s

volumes:
  sub2api_data:
  sub2api_postgres_data:
  sub2api_redis_data:
