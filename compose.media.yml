services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      YT_DLP_POT_PROVIDER_URL: http://bgutil-provider:4416
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    expose:
      - "4416"
