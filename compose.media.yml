services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      YT_DLP_POT_PROVIDER_URL: http://bgutil-provider:4416
      AI_GATEWAY_BASE_URL: http://bifrost:8080
      AI_GATEWAY_ENABLED: "true"
      WEB_AI_BRIDGE_BASE_URL: http://gemini-web2api:8081/v1
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - forecast-cache:/app/.data
    depends_on:
      bgutil-provider:
        condition: service_started
      bifrost:
        condition: service_healthy
    restart: unless-stopped

  bifrost:
    image: maximhq/bifrost:v1.6.11@sha256:a0f3e53c0558846ae3103a90de1c2be312ae646c76566af885e200b5f9f9edf7
    init: true
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      BIFROST_SKIP_WRITE_CHECK: "1"
      LOG_LEVEL: warn
      LOG_STYLE: json
    expose:
      - "8080"
    volumes:
      - ./infra/bifrost:/app/data:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    ports:
      - "127.0.0.1:4416:4416"
    expose:
      - "4416"
    restart: unless-stopped

  gemini-web2api:
    profiles: ["private-web-bridge"]
    build:
      context: .
      dockerfile: infra/gemini-web2api/Dockerfile
      args:
        GEMINI_WEBAPI_COMMIT: 955746dad14dae37c18bd766f34c8cd397ad50d4
    init: true
    environment:
      WEB_AI_BRIDGE_API_KEY: ${WEB_AI_BRIDGE_API_KEY}
      WEB_AI_BRIDGE_MODEL: ${WEB_AI_BRIDGE_MODEL:-gemini-3.1-pro}
      WEB_AI_BRIDGE_PRIMARY_MODEL: ${WEB_AI_BRIDGE_PRIMARY_MODEL:-gemini-flash}
      WEB_AI_BRIDGE_FALLBACK_MODEL: ${WEB_AI_BRIDGE_FALLBACK_MODEL:-gemini-pro}
      WEB_AI_BRIDGE_REQUEST_TIMEOUT_SEC: ${WEB_AI_BRIDGE_REQUEST_TIMEOUT_SEC:-75}
      WEB_AI_BRIDGE_MODEL_ATTEMPT_TIMEOUT_SEC: ${WEB_AI_BRIDGE_MODEL_ATTEMPT_TIMEOUT_SEC:-40}
    volumes:
      - type: bind
        source: ${WEB_AI_BRIDGE_COOKIE_HOST_PATH:-./.data/gemini-web-login-required.json}
        target: /run/secrets/gemini-cookie.json
        read_only: true
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://localhost:8081/v1/models',headers={'Authorization':'Bearer '+os.environ['WEB_AI_BRIDGE_API_KEY']}); raise SystemExit(0 if urllib.request.urlopen(r,timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 7s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  forecast-cache:
