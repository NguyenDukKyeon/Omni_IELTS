services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      YT_DLP_POT_PROVIDER_URL: http://bgutil-provider:4416
      AI_GATEWAY_BASE_URL: http://bifrost:8080
      AI_GATEWAY_ENABLED: "true"
      WEB_AI_BRIDGE_BASE_URL: http://gemini-web2api:8081/v1
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - forecast-cache:/app/.data
    depends_on:
      bgutil-provider:
        condition: service_started
      bifrost:
        condition: service_healthy

  bifrost:
    image: maximhq/bifrost:v1.6.11@sha256:a0f3e53c0558846ae3103a90de1c2be312ae646c76566af885e200b5f9f9edf7
    init: true
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      BIFROST_SKIP_WRITE_CHECK: "1"
      LOG_LEVEL: warn
      LOG_STYLE: json
    expose:
      - "8080"
    volumes:
      - ./infra/bifrost:/app/data:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    expose:
      - "4416"

  gemini-web2api:
    profiles: ["private-web-bridge"]
    build:
      context: .
      dockerfile: infra/gemini-web2api/Dockerfile
      args:
        GEMINI_WEB2API_COMMIT: 2bb988bfcbb82a7fab5d2c99aa5560ff40d64f7e
    init: true
    environment:
      WEB_AI_BRIDGE_API_KEY: ${WEB_AI_BRIDGE_API_KEY}
      WEB_AI_BRIDGE_MODEL: ${WEB_AI_BRIDGE_MODEL:-gemini-3.6-flash}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://localhost:8081/v1/models',headers={'Authorization':'Bearer '+os.environ['WEB_AI_BRIDGE_API_KEY']}); raise SystemExit(0 if urllib.request.urlopen(r,timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 7s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  forecast-cache:
